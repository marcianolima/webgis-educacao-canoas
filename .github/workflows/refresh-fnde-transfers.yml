name: WebGIS Educação | FNDE PNAE PNATE
on:
  push:
    branches: [main]
    paths: ['scripts/fnde_transfers.py','.github/workflows/refresh-fnde-transfers.yml']
  workflow_dispatch:
  schedule:
    - cron: '40 9 20 * *'
permissions: {contents: write, actions: write}
concurrency: {group: fn-de-transfer-canoas, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Baixar por HTTPS API FNDE, conferir cabeçalhos/competência e reconciliar município
        run: python scripts/fnde_transfers.py
      - name: Validar indicadores e snapshots
        run: python -m unittest discover -s tests -v
      - name: Persistir apenas agregados públicos
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/fnde_actuals.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: repasses PNAE por ente e PNATE a pagar, fonte FNDE'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar GitHub Pages após a carga de dados
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
