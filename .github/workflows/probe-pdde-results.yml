name: Teste PDDE escola e exercício
on:
  push:
    paths: ['scripts/probe_pdde_results.py','.github/workflows/probe-pdde-results.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_pdde_results.py
