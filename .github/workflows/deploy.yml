name: WebGIS Educação | Testar e publicar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-webgis-educacao
  cancel-in-progress: false

jobs:
  verify:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar integridade dos dados e coletores
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript e gerar dist
        run: npm run build
      - name: Validar artefatos e rotas do Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          dist=Path('dist')
          page=(dist/'index.html').read_text(encoding='utf-8')
          assert 'WebGIS Educação' in page, 'index.html ausente/incorreto'
          assert '/webgis-educacao-canoas/assets/' in page, 'URLs dos assets sem base GitHub Pages'
          for name in ('summary.json','schools.json','schools.geojson','quality.json','finance.json','pnae.json','ibge_age.json','fnde_actuals.json'):
              content=json.loads((dist/'data'/name).read_text(encoding='utf-8'))
              assert content is not None
              print(f'{name}: {(dist/"data"/name).stat().st_size} bytes')
          q=json.loads((dist/'data/quality.json').read_text(encoding='utf-8'))
          f=json.loads((dist/'data/finance.json').read_text(encoding='utf-8'))
          p=json.loads((dist/'data/pnae.json').read_text(encoding='utf-8'))
          d=json.loads((dist/'data/ibge_age.json').read_text(encoding='utf-8'))
          assert p['fundingStatus']=='planned'
          assert d['totalPopulation']==347657
          transferred=json.loads((dist/'data/fnde_actuals.json').read_text(encoding='utf-8'))
          assert transferred['municipalityCode']=='4304606'
          assert q['municipality']=='4304606'
          assert f['municipalityCode']==4304606
          assert 2025 in [row['year'] for row in f['series']]
          summary=json.loads((dist/'data/summary.json').read_text(encoding='utf-8'))
          assert summary['municipality']['ibge']=='4304606'
          print('Assets:',len(list((dist/'assets').glob('*.js'))),'JS compilados')
          assert list((dist/'assets').glob('*.js'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  visual:
    name: Testar layouts e gerar capturas de tela
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Testar fluxos desktop e mobile em Chromium
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-visuais-webgis-educacao
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: Publicar site
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Testar URL pública, arquivos e catálogo no GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json,os,re,time,urllib.request
          from urllib.parse import urljoin
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          error=None
          for attempt in range(10):
              try:
                  def fetch(path):
                      url=urljoin(base,path)
                      req=urllib.request.Request(url,headers={'User-Agent':'WebGIS-Educacao-CI/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          if r.status != 200:raise ValueError(f'{path}: HTTP {r.status}')
                          return r.read()
                  html=fetch('').decode('utf-8')
                  assert 'WebGIS Educação' in html
                  scripts=re.findall(r'src="([^"]+\.js)"',html)
                  assert scripts,'Nenhum JS no index'
                  js_path=scripts[0].replace('/webgis-educacao-canoas/','')
                  assert len(fetch(js_path)) > 10000
                  summary=json.loads(fetch('data/summary.json'))
                  school=json.loads(fetch('data/schools.json'))
                  geo=json.loads(fetch('data/schools.geojson'))
                  q=json.loads(fetch('data/quality.json'))
                  f=json.loads(fetch('data/finance.json'))
                  p=json.loads(fetch('data/pnae.json'))
                  d=json.loads(fetch('data/ibge_age.json'))
                  assert p['fundingStatus']=='planned'
                  assert d['totalPopulation']==347657
                  transferred=json.loads(fetch('data/fnde_actuals.json'))
                  assert transferred['municipalityCode']=='4304606'
                  assert q['municipality']=='4304606'
                  assert f['municipalityCode']==4304606
                  assert any(r['year']==2025 for r in f['series'])
                  assert summary['municipality']['ibge']=='4304606'
                  assert school['schemaVersion']==1
                  assert len(geo['features'])<=len(school['schools'])
                  if school['schools']:assert len(geo['features'])>=30
                  print(f'HTTP 200: {base}, JS, summary, schools, GeoJSON, IDEB/SAEB, SICONFI, PNAE previsto e perfil etário IBGE')
                  print(f'Escolas publicadas: {len(school["schools"])}; coordenadas: {len(geo["features"])}; fonte ano: {school["year"]}')
                  break
              except Exception as exc:
                  error=exc
                  print(f'Tentativa {attempt+1}/10: {exc}',flush=True)
                  time.sleep(6)
          else:
              raise RuntimeError('Falha no teste HTTP pós-deploy: '+str(error))
          PY
