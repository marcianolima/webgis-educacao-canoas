name: WebGIS Educação | SIOPE FNDE 2025
on:
  push:
    paths: ['scripts/fnde_siope.py','.github/workflows/refresh-siope.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 8 15 * *'
permissions: {contents: write}
concurrency: {group: siope-educacao-canoas, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ler declarações SIOPE 6º bimestre e validar município
        run: python scripts/fnde_siope.py
      - run: python -m unittest discover -s tests -v
      - name: Persistir apenas agregados SIOPE sem duplicar SICONFI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/siope.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: declarações SIOPE por exercício, fonte FNDE'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
