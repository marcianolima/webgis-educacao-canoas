name: Diagnosticar proteção PDDE
on:
  push:
    paths: ['scripts/debug_pdde_agent.py','.github/workflows/debug-pdde-agent.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install beautifulsoup4==4.12.3
      - run: python scripts/debug_pdde_agent.py
