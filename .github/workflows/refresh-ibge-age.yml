name: WebGIS Educação | Perfil etário IBGE 2022
on:
  push:
    paths: ['scripts/ibge_age.py','.github/workflows/refresh-ibge-age.yml']
  workflow_dispatch:
  schedule:
    - cron: '30 11 10 1 *'
permissions: {contents: write}
concurrency: {group: ibge-ages-canoas, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/ibge_age.py
      - run: python -m unittest discover -s tests -v
      - name: Versionar apenas agregados e publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/ibge_age.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: perfil etário Censo IBGE 2022, SIDRA 9514'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
