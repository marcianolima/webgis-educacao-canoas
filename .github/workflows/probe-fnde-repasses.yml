name: Inspecionar layout de repasses FNDE
on:
  push:
    paths: ['scripts/probe_fnde_repasses.py','.github/workflows/probe-fnde-repasses.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_fnde_repasses.py
