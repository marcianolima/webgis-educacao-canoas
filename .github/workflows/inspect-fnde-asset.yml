name: Diagnóstico API pública FNDE Antonieta
on:
  push:
    paths: ['scripts/inspect_fnde_asset.py','.github/workflows/inspect-fnde-asset.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/inspect_fnde_asset.py
