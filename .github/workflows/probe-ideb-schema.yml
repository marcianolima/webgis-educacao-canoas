name: IDEB 2025 | Ler schema oficial das planilhas
on:
  push:
    paths: ['scripts/probe_ideb_schema.py','.github/workflows/probe-ideb-schema.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5
      - shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP "ideb_escolas_2025.zip"
          & curl.exe --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 700 --silent --show-error -o $zip "https://download.inep.gov.br/ideb/resultados/divulgacao_anos_iniciais_escolas_2025.zip"
          if($LASTEXITCODE -ne 0){throw "IDEB indisponivel"}
          "IDEB_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python scripts/probe_ideb_schema.py
