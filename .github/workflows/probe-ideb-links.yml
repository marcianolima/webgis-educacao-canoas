name: Descobrir arquivos originais IDEB 2025 escola
on:
  push:
    paths: ['scripts/probe_ideb_links.py','.github/workflows/probe-ideb-links.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_ideb_links.py
