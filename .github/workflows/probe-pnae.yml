name: Diagnóstico de planilhas FNDE PNAE
on:
  push:
    paths: ['scripts/probe_pnae_workbook.py','.github/workflows/probe-pnae.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_pnae_workbook.py
