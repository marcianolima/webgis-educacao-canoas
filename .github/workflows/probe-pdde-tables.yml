name: Inspecionar tabelas PDDE por código INEP
on:
  push:
    paths: ['scripts/probe_pdde_tables.py','.github/workflows/probe-pdde-tables.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install beautifulsoup4==4.12.3
      - run: python scripts/probe_pdde_tables.py
