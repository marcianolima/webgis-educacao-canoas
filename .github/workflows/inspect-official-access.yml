name: Investigação de canais oficiais INEP FNDE
on:
  push:
    paths: ['scripts/inspect_official_access.py','.github/workflows/inspect-official-access.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/inspect_official_access.py
