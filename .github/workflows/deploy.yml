name: WebGIS Educação | Testar e publicar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-webgis-educacao
  cancel-in-progress: false

jobs:
  verify:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar integridade dos dados e coletores
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript e gerar dist
        run: npm run build
      - name: Validar artefatos e rotas do Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          dist=Path('dist')
          page=(dist/'index.html').read_text(encoding='utf-8')
          assert 'WebGIS Educação' in page, 'index.html ausente/incorreto'
          assert '/webgis-educacao-canoas/assets/' in page, 'URLs dos assets sem base GitHub Pages'
          for name in ('summary.json','schools.json','schools.geojson'):
              content=json.loads((dist/'data'/name).read_text(encoding='utf-8'))
              assert content is not None
              print(f'{name}: {(dist/"data"/name).stat().st_size} bytes')
          summary=json.loads((dist/'data/summary.json').read_text(encoding='utf-8'))
          assert summary['municipality']['ibge']=='4304606'
          print('Assets:',len(list((dist/'assets').glob('*.js'))),'JS compilados')
          assert list((dist/'assets').glob('*.js'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar site
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
