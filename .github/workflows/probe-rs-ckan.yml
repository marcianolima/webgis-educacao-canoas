name: Inspecionar planilhas oficiais SEDUC RS Censo 2025
on:
  push:
    paths: ['scripts/probe_rs_ckan.py','.github/workflows/probe-rs-ckan.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python scripts/probe_rs_ckan.py
