name: INEP IDEB 2025 | Escolar por código
on:
  push:
    paths: ['scripts/inep_ideb_schools.py','.github/workflows/collect-ideb-schools.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ideb-school-2025-canoas, cancel-in-progress: false}
jobs:
  schools:
    runs-on: windows-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Baixar os 3 arquivos oficiais IDEB por escola com Schannel e verificar ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $resources=@{
            "FUNDAMENTALINITIAL"="divulgacao_anos_iniciais_escolas_2025.zip";
            "FUNDAMENTALFINAL"="divulgacao_anos_finais_escolas_2025.zip";
            "HIGHSCHOOL"="divulgacao_ensino_medio_escolas_2025.zip"
          }
          foreach($name in $resources.Keys){
            $zip=Join-Path $env:RUNNER_TEMP $resources[$name]
            $url="https://download.inep.gov.br/ideb/resultados/"+$resources[$name]
            & curl.exe --fail --location --retry 9 --retry-all-errors --retry-delay 5 --connect-timeout 25 --max-time 800 --silent --show-error --output $zip $url
            if($LASTEXITCODE -ne 0){throw "INEP IDEB $name download falhou"}
            "INEP_IDEB_$($name)_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "$name $((Get-Item $zip).Length) bytes"
          }
      - name: Ler notas IDEB e proficiências por código INEP
        shell: pwsh
        run: python scripts/inep_ideb_schools.py
      - name: Validação cruzada IDEB oficial municipal e ausência de notas não divulgadas
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          d=json.loads(Path("public/data/ideb_schools.json").read_text(encoding="utf8"))
          assert d["municipalityCode"]=="4304606"
          assert d["stages"]["fundamentalInitial"]["records"]["43007520"]["current"]["ideb"]==7.3
          assert sum(x["withIDEB2025"] for x in d["stages"].values())>=55
          for stage in d["stages"].values():
           for code,x in stage["records"].items():
            assert code==x["inep"] and len(code)==8
            v=x["current"]["ideb"]
            assert v is None or 0<=v<=10
          print("IDEB 2025 escolas com notas",sum(s["withIDEB2025"] for s in d["stages"].values()))
          '@ | python -
      - name: Versionar somente notas escolares públicas
        shell: pwsh
        run: |
          $file=Join-Path $env:RUNNER_TEMP "ideb_schools.json"
          Copy-Item "public/data/ideb_schools.json" $file
          git fetch origin main
          if($LASTEXITCODE -ne 0){throw "Git fetch falhou"}
          git reset --hard origin/main
          if($LASTEXITCODE -ne 0){throw "Git reset falhou"}
          Copy-Item $file "public/data/ideb_schools.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ideb_schools.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "data: IDEB 2025 por escola, três etapas, INEP oficial"
            if($LASTEXITCODE -ne 0){throw "commit falhou"}
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){throw "push falhou"}
          }
