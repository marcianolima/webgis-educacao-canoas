name: WebGIS Educação | Indicadores INEP via SEDUC RS
on:
  push:
    paths:
      - 'scripts/rs_indicators.py'
      - '.github/workflows/refresh-rs-indicators.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 9 25 9 *'
permissions: {contents: write}
concurrency: {group: rs-indicators-canoas, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Extrair e reconciliar séries ICG AFD INSE Fluxo do RS
        run: python scripts/rs_indicators.py
      - run: python -m unittest discover -s tests -v
      - name: Versionar indicadores agregados verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/rs_indicators.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: rendimento, docentes, complexidade e INSE por rede e ano'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
