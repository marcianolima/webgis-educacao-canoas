name: Investigar indicadores oficiais RS por escola
on:
  push:
    paths: ['scripts/probe_rs_indicators.py','.github/workflows/probe-rs-indicators.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/probe_rs_indicators.py
