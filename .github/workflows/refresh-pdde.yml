name: WebGIS Educação | PDDE por escola
on:
  push:
    paths: ['scripts/fnde_pdde.py','.github/workflows/refresh-pdde.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 10 13 * *'
permissions: {contents: write}
concurrency: {group: pdde-canoas-etl, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Consultar pagamentos por INEP e conferir valores por escola
        run: python scripts/fnde_pdde.py
      - name: Verificar cobertura e privacidade
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("public/data/pdde_schools.json").read_text())
          assert d["municipalityCode"]=="4304606" and d["year"]==2025
          assert d["schoolsResponded"]>=d["schoolsChecked"]*.8
          for v in d["byInep"].values():
              assert v["inep"].isdigit() and len(v["inep"])==8
              assert "bank" not in v and "cnpj" not in v and "account" not in v
              if v["status"]=="ok":
                  assert abs(sum(p["paidBRL"] for p in v["payments"])-v["paidBRL"])<.05
          print("PDDE schools",d["schoolsResponded"],"paid",d["totalPaidRespondedBRL"])
          PY
      - name: Commitar somente resultados públicos agregados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/pdde_schools.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: PDDE 2025 pago por escola INEP, cobertura auditável'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
